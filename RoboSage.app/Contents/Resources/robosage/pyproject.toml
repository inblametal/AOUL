[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robosage"
version = "0.1.0"
description = "AI Robotics Assistant, Safety Auditor & Real-time Diagnostic Copilot"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "Antigravity Robotics AI Team" }
]
keywords = ["ros2", "robotics", "ai", "diagnostics", "safety", "llm", "triage", "nav2", "tf2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
full = [
    "rich>=13.0.0",
    "click>=8.0.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
robosage = "robosage.cli:main"
